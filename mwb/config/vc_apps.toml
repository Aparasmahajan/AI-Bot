# Call apps MWB recognises (design §9.3). New apps go here, without code changes. The design sketched this file as
# YAML; it is TOML because Python reads TOML without an extra library.
#
#   packaged  Store-app names, as Windows lists them under ...\ConsentStore\microphone
#   exe       desktop programs, by file name
#   tabs      text in a browser window title that marks a meeting tab
#   policy    record | ask | never      personal = true: always ask, whatever the policy
#
# Your own choices ("Never for Slack", "always record this app") are kept in MWB's database and win over these.

browsers = ["chrome.exe", "msedge.exe", "brave.exe", "firefox.exe", "opera.exe", "vivaldi.exe"]
# Programs that hold the mic without being a call: dictation and recorders. MWB's own process is always left out.
not_calls = ["Wispr Flow.exe", "WisprFlow.exe", "Microsoft.WindowsSoundRecorder_8wekyb3d8bbwe", "SoundRecorder.exe"]

[[app]]
id = "teams"
name = "Teams"
packaged = ["MSTeams_8wekyb3d8bbwe"]             # confirmed on this laptop (P0-5, 13 Oct 2026)
exe = ["ms-teams.exe", "Teams.exe"]
tabs = ["| Microsoft Teams"]
policy = "record"

