<meta charset="utf-8">
<title>MWB Work Assistant POC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a component datasheet. Running header, numbered sections that cross-reference (§n),
   numbered figures with captions, two-column front matter, contents rail on wide screens.
   Light theme = a printed datasheet on engineering paper. Dark theme = a blueprint. */
:root{
  --paper:#F3F5F8;        /* page ground; a faint 24 px grid is drawn on it */
  --sheet:#FFFFFF;        /* the document itself */
  --ink:#0E1726;          /* text and strokes */
  --ink-2:#465267;        /* secondary text */
  --ink-3:#66738A;        /* ticks, quiet labels */
  --rule:#D3D9E3;         /* table rules and frames */
  --wash:#EDF1F7;         /* header fills, neutral blocks */
  --cobalt:#2148C9;       /* structure: section marks, focal blocks, proposed values */
  --cobalt-wash:#E3E9FB;
  --signal:#CF3F0A;       /* audio and recording */
  --signal-wash:#FCE7DC;
  --amber:#946000;        /* Timepass */
  --amber-wash:#F7ECD3;
  --ok:#21734B;
  --grid:rgba(14,23,38,.045);
  --f-display:"IBM Plex Sans Condensed","Arial Narrow","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono","Cascadia Mono",Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#06122A; --sheet:#0A1A36; --ink:#E4EBF6; --ink-2:#A9B7CF; --ink-3:#8494B2;
    --rule:#22416F; --wash:#0F264C; --cobalt:#8FB2FF; --cobalt-wash:#15315F;
    --signal:#FF8D55; --signal-wash:#3B2522; --amber:#F1B65C; --amber-wash:#3A301C; --ok:#70D49C;
    --grid:rgba(143,178,255,.07);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#06122A; --sheet:#0A1A36; --ink:#E4EBF6; --ink-2:#A9B7CF; --ink-3:#8494B2;
  --rule:#22416F; --wash:#0F264C; --cobalt:#8FB2FF; --cobalt-wash:#15315F;
  --signal:#FF8D55; --signal-wash:#3B2522; --amber:#F1B65C; --amber-wash:#3A301C; --ok:#70D49C;
  --grid:rgba(143,178,255,.07);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
body{margin:0;background-color:var(--paper);color:var(--ink);font:400 16px/1.6 var(--f-body);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px}
a{color:var(--cobalt);text-underline-offset:2px}
a:focus-visible,summary:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}
b,strong{font-weight:600}

.wrap{max-width:1320px;margin:0 auto;padding-inline:16px;padding-block:24px 72px;display:grid;grid-template-columns:minmax(0,1fr);gap:24px}
@media (min-width:1200px){.wrap{grid-template-columns:216px minmax(0,1fr);padding-inline:24px}}

/* contents */
.rail{display:none}
@media (min-width:1200px){.rail{display:block;position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px);align-self:start;max-height:calc(100vh - 40px);overflow:auto;padding-right:4px}}
.toc-h{margin:6px 0 12px 12px;font:600 11.5px/1 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.toc{list-style:none;margin:0;padding:0;display:grid;gap:1px;font:500 14px/1.3 var(--f-display)}
.toc a{display:grid;grid-template-columns:26px minmax(0,1fr);gap:4px;padding:5px 10px;color:var(--ink-2);text-decoration:none;border-left:2px solid transparent}
.toc a:hover{color:var(--ink);background:var(--wash)}
.toc a.on{color:var(--ink);border-left-color:var(--cobalt);background:var(--wash)}
.toc a span{font:500 12px/1.5 var(--f-mono);color:var(--ink-3)}
.toc-m{margin:22px 0 0;border:1px solid var(--rule)}
.toc-m summary{cursor:pointer;padding:11px 14px;font:600 12px/1.4 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.toc-m .toc{padding:0 6px 10px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
@media (min-width:1200px){.toc-m{display:none}}

/* sheet */
.sheet{background:var(--sheet);border:1px solid var(--rule);min-width:0}
.runhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 24px;padding:10px clamp(16px,4vw,52px);border-bottom:1px solid var(--rule);font:500 11.5px/1.5 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.runhead b{color:var(--ink)}
.inner{padding-inline:clamp(16px,4vw,52px);padding-block:0 56px}

/* title block */
.title{display:grid;grid-template-columns:minmax(0,1fr);gap:28px;padding-block:40px 30px;border-bottom:2px solid var(--ink)}
@media (min-width:880px){.title{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);align-items:end}}
.eyebrow{margin:0 0 10px;font:600 12px/1.4 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--cobalt)}
.product{margin:0;font:700 clamp(68px,11vw,116px)/.84 var(--f-display);letter-spacing:-.015em}
.subtitle{margin:16px 0 0;font:400 clamp(17px,1.9vw,19.5px)/1.5 var(--f-body);color:var(--ink-2);max-width:54ch;text-wrap:pretty}
.keyspecs{margin:0;display:grid;grid-template-columns:max-content minmax(0,1fr);gap:7px 16px;padding:16px 18px;border:1px solid var(--rule);background:var(--wash)}
.keyspecs dt{font:600 11px/1.75 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.keyspecs dd{margin:0;font:500 14px/1.6 var(--f-mono);font-variant-numeric:tabular-nums;min-width:0}
.k-cap{margin:8px 0 0;font-size:12.5px;line-height:1.45;color:var(--ink-2)}

/* front matter */
.front{display:grid;grid-template-columns:minmax(0,1fr);gap:0 44px}
@media (min-width:880px){.front{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}}
.front section{padding-block:30px 0}
.feat{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.feat li{position:relative;padding-left:20px;margin:0}
.feat li::before{content:"";position:absolute;left:1px;top:.62em;width:7px;height:7px;background:var(--cobalt)}

/* sections and type */
section{scroll-margin-top:20px}
.sec{padding-block:52px 4px}
h2{display:flex;align-items:center;gap:14px;margin:0 0 18px;font:600 clamp(24px,3vw,30px)/1.15 var(--f-display);text-wrap:balance}
h2 .n{flex:none;display:inline-grid;place-items:center;min-width:38px;height:38px;padding-inline:6px;background:var(--cobalt);color:var(--sheet);font:600 17px/1 var(--f-mono)}
.front h2{font-size:22px}
.front h2 .n{min-width:30px;height:30px;font-size:14px}
h3{display:flex;align-items:baseline;gap:10px;margin:34px 0 10px;font:600 19.5px/1.3 var(--f-display);text-wrap:balance}
h3 .n{flex:none;font:600 14px/1 var(--f-mono);color:var(--cobalt)}
h4{margin:22px 0 8px;font:600 16.5px/1.35 var(--f-display)}
p,li{text-wrap:pretty}
/* :where() keeps these defaults at element specificity, so component classes always win */
:where(.inner) p{max-width:74ch;margin:0 0 14px}
:where(.inner) :is(ul,ol){max-width:76ch;margin:0 0 16px;padding-left:22px}
:where(.inner) li{margin-bottom:7px}
.toc li{margin:0}
.lead{font-size:17.5px;color:var(--ink-2)}
.small{font-size:14px;color:var(--ink-2)}
code{font:500 .86em/1.2 var(--f-mono);background:var(--wash);padding:2px 5px}
kbd{display:inline-block;font:600 12px/1 var(--f-mono);padding:4px 6px 3px;border:1px solid var(--rule);border-bottom-width:2px;background:var(--sheet);color:var(--ink);white-space:nowrap}

/* tables */
.tbl{overflow-x:auto;margin:16px 0 24px;border:1px solid var(--rule)}
table{border-collapse:collapse;width:100%;font-size:14.5px;line-height:1.45}
th,td{text-align:left;vertical-align:top;padding:9px 12px;border-bottom:1px solid var(--rule)}
thead th{font:600 12px/1.3 var(--f-display);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);background:var(--wash);white-space:nowrap}
tbody tr:last-child>*{border-bottom:0}
tbody th{font-weight:600}
tr.grp th{padding-top:16px;background:var(--sheet);font:600 11.5px/1.3 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--cobalt)}
.num{text-align:right;font-family:var(--f-mono);font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.mono{font-family:var(--f-mono);font-size:13.5px}
.nw{white-space:nowrap}
.tbl.dense th,.tbl.dense td{padding:7px 10px}
.w-min{width:1%;white-space:nowrap}

/* boxed notes, label set into the frame like a datasheet note */
.box{position:relative;border:1px solid var(--rule);padding:20px 18px 6px;margin:26px 0 22px;max-width:82ch}
.box>.lbl{position:absolute;top:-10px;left:12px;padding:0 7px;background:var(--sheet);font:600 11.5px/20px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.box.find{border-color:var(--cobalt)}
.box.find>.lbl{color:var(--cobalt)}
.box.warn{border-color:var(--signal)}
.box.warn>.lbl{color:var(--signal)}
.box p,.box ul{margin-bottom:12px}

/* figures */
.fig{margin:26px 0 30px}
.fig-frame{overflow-x:auto;border:1px solid var(--rule);padding:14px;background:var(--sheet)}
.dg{display:block;width:100%;height:auto}
figcaption{margin-top:9px;font:500 14.5px/1.45 var(--f-display);color:var(--ink-2);max-width:92ch}
figcaption b{color:var(--ink);margin-right:8px}

/* svg vocabulary */
.dg text{font-family:var(--f-body);font-size:12.5px;fill:var(--ink)}
.dg .m{font-family:var(--f-mono);font-size:11.5px}
.dg .k10{font-size:10px}
.dg .h{font-family:var(--f-display);font-weight:600;font-size:14px}
.dg .big{font-size:20px}
.dg .s{font-size:12.5px}
.dg .b{font-weight:600}
.dg .dim{fill:var(--ink-3)}
.dg .mid{fill:var(--ink-2)}
.dg .tc{fill:var(--cobalt)}
.dg .ts{fill:var(--signal)}
.dg .ta{fill:var(--amber)}
.dg .bx{fill:var(--sheet);stroke:var(--ink);stroke-width:1.25}
.dg .bx-w{fill:var(--wash);stroke:var(--ink-2);stroke-width:1}
.dg .bx-c{fill:var(--cobalt-wash);stroke:var(--cobalt);stroke-width:1.5}
.dg .bx-s{fill:var(--signal-wash);stroke:var(--signal);stroke-width:1.5}
.dg .bx-a{fill:var(--amber-wash);stroke:var(--amber);stroke-width:1.5}
.dg .er-h{fill:var(--wash);stroke:var(--ink);stroke-width:1.25}
.dg .rg{fill:none;stroke:var(--ink);stroke-width:1.5}
.dg .rg-d{fill:none;stroke:var(--ink-2);stroke-width:1.25;stroke-dasharray:6 4}
.dg .ln{fill:none;stroke:var(--ink-2);stroke-width:1.25}
.dg .ln-c{fill:none;stroke:var(--cobalt);stroke-width:1.5}
.dg .ln-s{fill:none;stroke:var(--signal);stroke-width:1.5}
.dg .ln-d{fill:none;stroke:var(--ink-3);stroke-width:1.25;stroke-dasharray:4 3}
.dg .dash{stroke-dasharray:6 4}
.dg .grid{stroke:var(--rule);stroke-width:1}
.dg .axis{stroke:var(--ink-2);stroke-width:1}
.dg .bar-c{fill:var(--cobalt)}
.dg .bar-w{fill:var(--ink-3)}
.dg .bar-s{fill:var(--signal)}
.dg .area-c{fill:var(--cobalt-wash);stroke:var(--cobalt);stroke-width:1.5}
.dg .mk-ink{fill:var(--ink-2)}
.dg .mk-c{fill:var(--cobalt)}
.dg .mk-s{fill:var(--signal)}
.dg .ring{fill:none;stroke:var(--ink);stroke-width:2}
.dg .ring-s{fill:none;stroke:var(--signal);stroke-width:2}
.dg .dot-c{fill:var(--cobalt)}
.dg .dot-s{fill:var(--signal)}
.dg .dot-a{fill:var(--amber)}
.dg .dot-g{fill:var(--ink-3)}
.dg .knock{fill:var(--sheet)}
.dg .key{fill:var(--wash);stroke:var(--rule);stroke-width:1}
.dg .key-hl{fill:var(--cobalt-wash);stroke:var(--cobalt);stroke-width:1.5}
.dg .key-s{fill:var(--signal-wash);stroke:var(--signal);stroke-width:1.5}
/* indicator skins: outline classes first, fill classes after, so "o-c f-cw" keeps both */
.dg .o-i{fill:none;stroke:var(--ink-2);stroke-width:1.6}
.dg .o-c{fill:none;stroke:var(--cobalt);stroke-width:1.8}
.dg .o-a{fill:none;stroke:var(--amber);stroke-width:1.8}
.dg .o-ok{fill:none;stroke:var(--ok);stroke-width:2}
.dg .o-k{fill:none;stroke:var(--sheet);stroke-width:2}
.dg .f-i{fill:var(--ink-2)}
.dg .f-c{fill:var(--cobalt)}
.dg .f-a{fill:var(--amber)}
.dg .f-ok{fill:var(--ok)}
.dg .f-cw{fill:var(--cobalt-wash)}
.dg .f-aw{fill:var(--amber-wash)}
.dg .cap{stroke-linecap:round;stroke-linejoin:round}
.dg .dash2{stroke-dasharray:3 3}
.dg .op15{opacity:.15}
.dg .op3{opacity:.3}
.dg .op35{opacity:.35}
.dg .op5{opacity:.5}
.dg .op65{opacity:.65}

/* chips */
.pri,.tag{display:inline-block;font:600 10.5px/1 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;padding:4px 6px;white-space:nowrap;border:1px solid transparent}
.pri.must{background:var(--cobalt);border-color:var(--cobalt);color:var(--sheet)}
.pri.should{border-color:var(--cobalt);color:var(--cobalt)}
.pri.could{border-color:var(--ink-3);color:var(--ink-2)}
.pri.later{border-color:var(--ink-3);border-style:dashed;color:var(--ink-2)}
.tag.work{background:var(--cobalt-wash);color:var(--cobalt)}
.tag.tp{background:var(--amber-wash);color:var(--amber)}
.tag.meas{border-color:var(--ok);color:var(--ok)}
.tag.est{border-color:var(--ink-3);color:var(--ink-2)}
.tag.tgt{border-color:var(--cobalt);color:var(--cobalt)}
.tag.hi{background:var(--signal-wash);color:var(--signal)}
.tag.md{background:var(--amber-wash);color:var(--amber)}
.tag.lo{background:var(--wash);color:var(--ink-2)}

/* code */
pre{margin:14px 0 22px;padding:14px 16px;background:var(--wash);border:1px solid var(--rule);overflow-x:auto;font:400 13px/1.6 var(--f-mono);color:var(--ink);tab-size:2}
pre code{background:none;padding:0;font:inherit}
pre .c{color:var(--ink-2)}
.code-h{margin:18px 0 0;padding:7px 12px;border:1px solid var(--rule);border-bottom:0;font:600 11.5px/1.4 var(--f-mono);letter-spacing:.05em;color:var(--ink-2);background:var(--sheet)}
.code-h+pre{margin-top:0}

/* two columns */
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:4px 36px}
@media (min-width:900px){.cols{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cols>div{min-width:0}

/* sample journal */
.journal{border:1px solid var(--rule);background:var(--sheet);max-width:780px}
.j-bar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 12px;padding:8px 14px;border-bottom:1px solid var(--rule);background:var(--wash);font:500 12px/1.4 var(--f-mono);color:var(--ink-2)}
.j-body{padding:18px clamp(14px,3vw,24px) 12px}
.j-body h4{margin:0 0 8px;font:600 23px/1.2 var(--f-display)}
.j-body h5{margin:20px 0 8px;font:600 12px/1.3 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.j-body p,.j-body li{font-size:15px}
.j-body ul{padding-left:20px}
.cite{font:500 10.5px/1 var(--f-mono);color:var(--cobalt);background:var(--cobalt-wash);padding:2px 4px;margin-left:3px;vertical-align:1px;white-space:nowrap}
.j-body .tbl{margin:8px 0 10px}
.j-body table{font-size:13.5px}
.bars{display:grid;gap:6px;max-width:560px}
.bar-row{display:grid;grid-template-columns:100px minmax(0,1fr) 64px;align-items:center;gap:10px;font-size:13.5px}
.bar-row .track{height:10px;background:var(--wash)}
.bar-row .fill{display:block;height:10px;background:var(--cobalt)}
.bar-row .fill.tp{background:var(--amber)}
.bar-row .v{font:500 12.5px/1 var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}

/* plan */
.phase{border-top:1px solid var(--rule);padding:16px 0 8px;display:grid;grid-template-columns:minmax(0,1fr);gap:6px 28px}
@media (min-width:900px){.phase{grid-template-columns:210px minmax(0,1fr)}}
.phase h4{margin:0;font:600 18px/1.25 var(--f-display)}
.phase .when{margin:4px 0 0;font:500 12px/1.5 var(--f-mono);color:var(--ink-2)}
.phase ul{margin:0 0 10px}
.exit{margin:0 0 8px;font-size:14.5px}
.exit b{font:600 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ok);margin-right:8px}

/* decisions */
.decide{list-style:none;padding:0;margin:0;counter-reset:d;display:grid;gap:12px;max-width:84ch}
.inner .decide{padding-left:0}
.decide li{counter-increment:d;display:grid;grid-template-columns:32px minmax(0,1fr);gap:14px;padding:14px 16px;border:1px solid var(--rule);margin:0}
.decide li::before{content:counter(d);display:grid;place-items:center;width:30px;height:30px;border:1.5px solid var(--cobalt);color:var(--cobalt);font:600 14px/1 var(--f-mono)}
.decide b{display:block;margin-bottom:3px}
.decide .def{display:block;margin-top:4px;font-size:14px;color:var(--ink-2)}

/* glossary */
.gloss{display:grid;grid-template-columns:minmax(0,1fr);gap:0 36px;margin:0}
@media (min-width:860px){.gloss{grid-template-columns:repeat(2,minmax(0,1fr))}}
.gloss div{padding:10px 0;border-bottom:1px solid var(--rule);min-width:0}
.gloss dt{font:600 15.5px/1.3 var(--f-display)}
.gloss dd{margin:3px 0 0;font-size:14.5px;color:var(--ink-2)}

.srcs{font-size:14.5px}
.srcs li{overflow-wrap:anywhere}
.foot{margin-top:56px;padding-top:14px;border-top:2px solid var(--ink);display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px;font:500 11.5px/1.5 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}

/* setup screen mockup (static, not a form) */
.mock{max-width:640px;border:1px solid var(--rule);background:var(--sheet);font-size:14.5px}
.mock-h{display:flex;justify-content:space-between;gap:8px;padding:9px 14px;border-bottom:1px solid var(--rule);background:var(--wash);font:600 12px/1.4 var(--f-mono);letter-spacing:.04em;color:var(--ink-2)}
.mock-b{padding:14px 16px 16px;display:grid;gap:12px}
.mock-found{margin:0;font:500 13px/1.6 var(--f-mono);color:var(--ink-2)}
.mock-found b{color:var(--ink);display:inline-block;min-width:72px}
.mock-q{margin:2px 0 0;font:600 16px/1.3 var(--f-display)}
.opts{display:grid;gap:6px}
.opt{display:grid;grid-template-columns:16px 26px minmax(0,1fr);gap:10px;align-items:start;padding:8px 10px;border:1px solid var(--rule)}
.opt .dot{width:14px;height:14px;margin-top:3px;border:1.5px solid var(--ink-2);border-radius:50%}
.opt.on{border-color:var(--cobalt);background:var(--cobalt-wash)}
.opt.on .dot{border-color:var(--cobalt);background:radial-gradient(circle,var(--cobalt) 0 40%,transparent 46%)}
.opt.off{opacity:.55}
.opt .lv{font:600 13px/1.6 var(--f-mono)}
.opt .ds{font-size:14px;color:var(--ink-2);min-width:0}
.opt .ds b{color:var(--ink)}
.chk{display:grid;grid-template-columns:16px minmax(0,1fr);gap:10px;font-size:14px;color:var(--ink-2)}
.chk .tick{position:relative;width:14px;height:14px;margin-top:3px;background:var(--cobalt)}
.chk .tick::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid var(--sheet);border-width:0 2px 2px 0;transform:rotate(45deg)}
.perf{display:flex;flex-wrap:wrap;gap:8px}
.sel{font:500 12.5px/1 var(--f-mono);padding:7px 9px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink-2)}
.sel b{color:var(--cobalt)}
